# Single source of truth for the models that pi exposes through the LiteLLM
# proxy. Both ~/.pi/agent/settings.json (enabledModels) and the
# litellm-provider extension (models[]) are rendered from this list.
#
# api: "anthropic-messages" is the provider default. Gemini uses
# "openai-completions" because LiteLLM's Anthropic-Messages translation for
# Vertex Gemini drops streamed tool-call arguments.
# adaptive: Vertex Claude 4.8+/5 need thinking.type "adaptive".
pi:
  default_model: gemini-3.5-flash
  models:
    - id: gemini-3.5-flash
      name: Gemini 3.5 Flash
      api: openai-completions
      reasoning: false
      context: 1048576
      max_tokens: 65536
    - id: gemini-3.7-flash
      name: Gemini 3.7 Flash
      api: openai-completions
      reasoning: true
      context: 1048576
      max_tokens: 65536
    - id: gemini-3.1-pro-preview
      name: Gemini 3.1 Pro
      api: openai-completions
      reasoning: true
      context: 1048576
      max_tokens: 65536
    - id: claude-sonnet-5
      name: Claude Sonnet 5
      reasoning: true
      adaptive: true
      context: 200000
      max_tokens: 65536
    - id: claude-opus-4-8
      name: Claude Opus 4.8
      reasoning: true
      adaptive: true
      context: 200000
      max_tokens: 32768
    - id: claude-sonnet-4-6
      name: Claude Sonnet 4.6
      reasoning: true
      adaptive: true
      context: 200000
      max_tokens: 65536
    - id: claude-haiku-4-5@20251001
      name: Claude Haiku 4.5
      reasoning: true
      adaptive: false
      context: 200000
      max_tokens: 65536
    - id: glm-5.2
      name: GLM 5.2
      reasoning: true
      context: 1048576
      max_tokens: 131072

  # Models that pi reaches through its own providers, not through the proxy.
  # The proxy ledger does not count them, so the cost popup ignores them.
  # Each id must have the form <pi-provider>/<model-id>.
  # The Codex models use the ChatGPT subscription. Log in one time on each
  # machine with /login in pi, then select "ChatGPT Plus/Pro (Codex)".
  extra_models:
    - openai-codex/gpt-5.5
    - openai-codex/gpt-5.4
    - openai-codex/gpt-5.4-mini
