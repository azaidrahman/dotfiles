symbolPreset: nerd
theme:
  dark: titanium
  light: light
setupVersion: 2
modelRoles:
  default: openai-codex/gpt-5.6-terra:high
# Terra caps at "high" in omp; omp rewrites ":max" to ":high" on start.
defaultThinkingLevel: high
# Model picker allowlist. Only proxy models and the native Codex provider have
# credentials here. The wildcard keeps every model that Codex makes available,
# including new models added to the local Codex model store.
enabledModels:
  - litellm/*
  - openai-codex/*
composer:
  shape: rail
statusLine:
  preset: custom
  separator: pipe
  contextLine: off
  sessionAccent: false
  transparent: true
  compactThinkingLevel: false
  leftSegments:
    - model
    - context_pct
    - session
  rightSegments:
    - path
    - git
  segmentOptions:
    model:
      showThinkingLevel: true
    path:
      abbreviate: true
      maxLength: 40
      stripWorkPrefix: true
    git:
      showBranch: true
      showStaged: false
      showUnstaged: false
      showUntracked: false
# Do not import Claude Code marketplace plugins (~/.claude/plugins/cache).
# Their MCP servers (atlassian, todoist) need tokens that omp does not have,
# so each start reports "MCP finished with failures". The Claude skills are
# already off below.
disabledProviders:
  - claude-plugins
# Keep startup context lean: don't auto-inject the whole Claude/Codex/Agents
# skill marketplace (~20% of the window before you type). pi-native skills stay,
# and slash-command invocation remains on for on-demand use.
skills:
  enabled: true
  enableSkillCommands: true
  enableClaudeUser: false
  enableClaudeProject: false
  enableCodexUser: false
  enableAgentsUser: false
  enableAgentsProject: false
  enablePiUser: true
  enablePiProject: true
task:
  isolation:
    mode: auto
    apply: false
    merge: branch
dev:
  autoqaConsent: granted
