[metadata]
name = "tmux-windows"
description = "List and switch between tmux windows"
requirements = ["tmux"]

[source]
no_sort = true
ansi = true
command = "~/.tmux/scripts/tv-tmux-windows.sh"
watch = 1.0
output = "{strip_ansi|split:\t:1}"

[keybindings]
enter = "actions:select"

[preview]
command = "tmux capture-pane -t '{strip_ansi|split:\t:1}' -p 2>/dev/null || echo 'No preview available'"

[actions.select]
description = "Switch to the selected window"
command = "tmux switch-client -t '{strip_ansi|split:\t:1}'"
mode = "execute"

[actions.kill]
description = "Kill the selected window"
command = "tmux kill-window -t '{strip_ansi|split:\t:1}'"
mode = "fork"
