# Hyper Navigation (CapsLock held)
# Displayed by help-hud in 4-column grid
# Format: key:label (sorted by QWERTY position)

hyper:
  # Basic arrows
  - h:←
  - j:↓
  - k:↑
  - l:→
  # Extended
  - u:home
  - p:end
  - x:⌫
  - f:expose
  # +Shift
  - ⇧h:prevTab
  - ⇧j:nextApp
  - ⇧k:prevApp
  - ⇧l:nextTab
  - ⇧x:fwd⌦
  # +Cmd (select)
  - ⌘h:sel←
  - ⌘j:sel↓
  - ⌘k:sel↑
  - ⌘l:sel→
  - ⌘u:selHome
  - ⌘p:selEnd
  # +Opt (word)
  - ⌥h:word←
  - ⌥l:word→
  # +Opt+Cmd (select word/3 lines)
  - ⌥⌘h:selWord←
  - ⌥⌘l:selWord→
  - ⌥⌘j:sel3↓
  - ⌥⌘k:sel3↑
  # +Ctrl
  - ⌃j:appExpose
  # Misc
  - spc:lang
  - ⌘spc:emoji
  - esc:capslock
