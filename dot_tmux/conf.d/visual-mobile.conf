# Minimal visual profile for the "mobile" session (Termius / small iOS screens).
# NOT sourced by the loader — mobile-attach.sh sources this at runtime, after
# creating the session, via: tmux source-file ~/.tmux/conf.d/visual-mobile.conf
# All options are scoped to the `mobile` session (-t mobile) so desktop clients
# on the same server are unaffected.

# Strip the tokyo-night powerline widgets; use short ASCII status.
set -t mobile status-left  "[#S] "
set -t mobile status-right "#{?client_prefix,^ ,}#(date '+%a %d %b %H:%M') "
set -t mobile status-left-length  20
set -t mobile status-right-length 40
set -t mobile status-style        "fg=white,bg=black"
set -t mobile window-status-format         " #I:#W "
set -t mobile window-status-current-format "[#I:#W]"
set -t mobile window-status-current-style  "fg=black,bg=cyan,bold"
set -t mobile window-status-separator      ""

# No pane title bar — drop the "— hostname —" border status (inherits global `top`)
set -t mobile pane-border-status off
# Quieter pane borders (no custom colors that may render oddly)
set -t mobile pane-border-style        "fg=white"
set -t mobile pane-active-border-style "fg=cyan"

# Drop the Ghostty-tuned dim-inactive-pane backgrounds (look wrong on Termius).
# Force terminal default rather than `set -u` — unsetting just inherits the
# dark global window-style, which is the teal artifact on Termius.
set -t mobile window-style        'bg=default'
set -t mobile window-active-style 'bg=default'

# Track the latest client's size so the iPhone doesn't fight a desktop client.
set -t mobile aggressive-resize on

# --- Window linking (phone-friendly): pull real windows into mobile on demand ---
# prefix+b opens a popup of windows from other sessions; selecting one links it
# into mobile and jumps onto it. Borrowed windows are auto-unlinked on detach so
# mobile is pristine on the next connect. The binding passes the triggering
# client so display-menu knows where to draw. See
# docs/superpowers/specs/2026-06-05-mobile-window-linking-design.md
bind b run-shell "~/.tmux/scripts/mobile-link-menu.sh '#{client_name}'"
set-hook -t mobile client-attached 'display-message -d 2500 "  prefix+b → link a window  "'
set-hook -t mobile client-detached 'run-shell "~/.tmux/scripts/mobile-unlink-all.sh"'
