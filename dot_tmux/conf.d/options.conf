# Non-visual tmux options. Always loaded (desktop, mobile, and minimal hosts).

# Enable 256-color and true color (RGB) support in tmux.
# tmux 3.2+ derives the RGB capability from terminal-features (keyed on the
# OUTER terminal name), not the legacy Tc/RGB entries in terminal-overrides.
set -g default-terminal "tmux-256color"
set -ga terminal-features ",xterm-ghostty:RGB:extkeys"

# General
# Don't auto-rename windows to the foreground command. start-ticket sets the
# window name once at launch; after that a manual rename-window persists.
set -g automatic-rename off
set -g set-clipboard on
set -g mouse on
set -g status-interval 5
set -g detach-on-destroy off
set -g allow-passthrough on

# Window for repeatable (bind -r) keys: Space layout cycling, j/k/h/l resize
set -g repeat-time 650

# Size windows to the most recently active client, not the smallest.
set -g window-size latest

# Status bar position (the bar's *appearance* lives in visual.conf)
set -g status-position bottom

# Monitor bells (Claude Code rings bell on completion)
set -gw monitor-bell on
set -g bell-action any

# vi mode for copy-mode movements
set-window-option -g mode-keys vi

# Extended keys (CSI u) so modified key combos reach apps
set -s extended-keys on
set -s extended-keys-format csi-u
