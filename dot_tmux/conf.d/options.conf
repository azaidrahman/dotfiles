# Non-visual tmux options. Always loaded (desktop, mobile, and minimal hosts).

# Enable 256-color and true color support in tmux
set -g default-terminal "tmux-256color"
set -g terminal-overrides ",xterm-ghostty:RGB,*256color*:Tc"

# General
set -g set-clipboard on
set -g mouse on
set -g status-interval 5
set -g detach-on-destroy off
set -g allow-passthrough on

# Window for repeatable (bind -r) keys: Space layout cycling, j/k/h/l resize
set -g repeat-time 650

# Size windows to the most recently active client, not the smallest.
set -g window-size latest

# Status bar position (the bar's *appearance* lives in visual.conf)
set -g status-position bottom

# Monitor bells (Claude Code rings bell on completion)
set -gw monitor-bell on
set -g bell-action any

# vi mode for copy-mode movements
set-window-option -g mode-keys vi

# Extended keys (CSI u) so modified key combos reach apps
set -g extended-keys on
set -g extended-keys-format csi-u
